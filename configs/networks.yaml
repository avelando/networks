benchmarks:
  standard:
    - ego_facebook
    - socfb_middlebury45
    - ca_grqc
    - ca_hepth
    - email_eu_core
    - email_univ
    - power_grid
    - power_1138_bus

networks:
  ego_facebook:
    name: ego-Facebook
    domain: social
    repository: SNAP
    description: Facebook social circles network
    enabled: true
    source:
      url: https://snap.stanford.edu/data/facebook_combined.txt.gz
      filename: facebook_combined.txt.gz
      archive: gzip
      extracted_filename: facebook_combined.txt
      sha256: null
    parser:
      type: edgelist
      directed: false
      comments: "#"
      delimiter: null
      nodetype: int

  socfb_middlebury45:
    name: socfb-Middlebury45
    domain: social
    repository: Network Data Repository
    description: Facebook university friendship network
    enabled: true
    source:
      url: https://nrvis.com/download/data/socfb/socfb-Middlebury45.zip
      filename: socfb-Middlebury45.zip
      archive: zip
      member_patterns:
        - "*.mtx"
        - "*.edges"
      sha256: null
    parser:
      type: matrix_market
      directed: false

  ca_grqc:
    name: ca-GrQc
    domain: scientific_collaboration
    repository: SNAP
    description: General Relativity and Quantum Cosmology collaboration network
    enabled: true
    source:
      url: https://snap.stanford.edu/data/ca-GrQc.txt.gz
      filename: ca-GrQc.txt.gz
      archive: gzip
      extracted_filename: ca-GrQc.txt
      sha256: null
    parser:
      type: edgelist
      directed: false
      comments: "#"
      delimiter: null
      nodetype: int

  ca_hepth:
    name: ca-HepTh
    domain: scientific_collaboration
    repository: SNAP
    description: High Energy Physics Theory collaboration network
    enabled: true
    source:
      url: https://snap.stanford.edu/data/ca-HepTh.txt.gz
      filename: ca-HepTh.txt.gz
      archive: gzip
      extracted_filename: ca-HepTh.txt
      sha256: null
    parser:
      type: edgelist
      directed: false
      comments: "#"
      delimiter: null
      nodetype: int

  email_eu_core:
    name: email-Eu-core
    domain: communication
    repository: SNAP
    description: Email communication network from a European research institution
    enabled: true
    source:
      url: https://snap.stanford.edu/data/email-Eu-core.txt.gz
      filename: email-Eu-core.txt.gz
      archive: gzip
      extracted_filename: email-Eu-core.txt
      sha256: null
    parser:
      type: edgelist
      directed: true
      comments: "#"
      delimiter: null
      nodetype: int

  email_univ:
    name: email-univ
    domain: communication
    repository: Network Data Repository
    description: University email communication network
    enabled: true
    source:
      url: https://nrvis.com/download/data/ia/ia-email-univ.zip
      filename: ia-email-univ.zip
      archive: zip
      member_patterns:
        - "*.mtx"
        - "*.edges"
      sha256: null

    parser:
      type: matrix_market
      directed: false

  power_grid:
    name: power-grid
    domain: infrastructure
    repository: Netzschleuder
    description: Western United States power grid
    enabled: true
    source:
      url: https://networks.skewed.de/net/power/files/power.csv.zip
      filename: power.csv.zip
      archive: zip
      member_patterns:
        - "*edge*.csv"
        - "*edges*.csv"
      sha256: null
    parser:
      type: csv
      directed: false
      separator: auto
      source_column: null
      target_column: null

  power_1138_bus:
    name: power-1138-bus
    domain: infrastructure
    repository: Network Data Repository
    description: Power network represented by a 1138-bus system
    enabled: true
    source:
      url: https://nrvis.com/download/data/power/power-1138-bus.zip
      filename: power-1138-bus.zip
      archive: zip
      member_patterns:
        - "*.mtx"
        - "*.edges"
      sha256: null

    parser:
      type: matrix_market
      directed: false