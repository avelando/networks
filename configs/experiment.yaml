experiment:
  random_seed: 42
  n_folds: 5

evaluation:
  primary_metric: average_precision

  average_precision:
    implementation: sklearn
    definition: non_interpolated_precision_recall

  ranking_metrics:
    - average_precision
    - roc_auc

  cutoff:
    strategy: positives_per_fold

  cutoff_metrics:
    - precision
    - recall
    - f1
    - ndcg

  ranking:
    tie_breaker: candidate_id
    stable_sort: true


statistics:
  alpha: 0.05
  metrics:
    - average_precision
    - roc_auc
  confirmatory_methods:
    - srw
    - fl
    - lpi
    - pfp

negative_sampling:
  primary_ratio: 1
  robustness_ratios:
    - 1
    - 5
    - 10

graph:
  directed: false
  weighted: false
  remove_self_loops: true
  use_largest_connected_component: true

connectivity:
  preserve_spanning_tree: true
  spanning_tree_strategy: seeded_randomized_kruskal

execution:
  max_workers: auto
  reserve_memory_gib: 2.0
  hard_cap: 16

  memory_per_worker_gib:
    profiling: 2.0
    fold_building: 3.0
    method_benchmark: 3.0
    sensitivity: 5.0
    robustness: 6.0