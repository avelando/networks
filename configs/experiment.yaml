experiment:
  random_seed: 42
  n_folds: 5

evaluation:
  primary_metric: average_precision

  ranking_metrics:
    - average_precision
    - roc_auc

  cutoff:
    strategy: positives_per_fold

  cutoff_metrics:
    - precision
    - recall
    - f1
    - ndcg

  ranking:
    tie_breaker: candidate_id
    stable_sort: true

negative_sampling:
  primary_ratio: 1
  robustness_ratios:
    - 1
    - 5
    - 10

graph:
  directed: false
  weighted: false
  remove_self_loops: true
  use_largest_connected_component: true

connectivity:
  preserve_spanning_tree: true
  spanning_tree_strategy: seeded_randomized_kruskal