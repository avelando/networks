families:
  local_similarity:
    name: Local similarity

  degree_based:
    name: Degree-based local

  local_bayesian:
    name: Local Bayesian

  enhanced_local:
    name: Enhanced local

  quasi_local_path:
    name: Path-based quasi-local

  quasi_local_walk:
    name: Walk-based quasi-local


analysis_families:
  standard_local:
    name: Standard local
    execution_families:
      - local_similarity
      - degree_based

  local_bayesian:
    name: Local Bayesian
    execution_families:
      - local_bayesian

  enhanced_local:
    name: Enhanced local
    execution_families:
      - enhanced_local

  quasi_local_path:
    name: Path-based quasi-local
    execution_families:
      - quasi_local_path

  quasi_local_walk:
    name: Walk-based quasi-local
    execution_families:
      - quasi_local_walk


complexity_classes:
  degree_pair:
    expression: "O(v k^2)"
    latex: "$O(vk^2)$"
    methods:
      - pa

  local_neighborhood:
    expression: "O(v k^3)"
    latex: "$O(vk^3)$"
    methods:
      - cn
      - aa
      - ra
      - ja
      - sa
      - so
      - hpi
      - hdi
      - llhn
      - lnb_cn
      - lnb_aa
      - lnb_ra
      - ia2
      - fsw

  extended_local:
    expression: "O(v k^4)"
    latex: "$O(vk^4)$"
    methods:
      - ra_cni
      - ia1
      - car_cn
      - car_aa
      - car_ra

  iterative_local:
    expression: "O(l v k^3)"
    latex: "$O(lvk^3)$"
    methods:
      - lit

  short_path_walk:
    expression: "O(l v^2 k)"
    latex: "$O(lv^2k)$"
    methods:
      - lpi
      - fl
      - lrw
      - srw

  third_order_path:
    expression: "O(v k^6)"
    latex: "$O(vk^6)$"
    methods:
      - ora_cni

  propflow:
    expression: "O(v l k^l)"
    latex: "$O(vlk^l)$"
    methods:
      - pfp


