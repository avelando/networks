[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "link-prediction-benchmark"
version = "0.1.0"
description = "Experimental benchmark of local and quasi-local methods for link prediction."
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "statsmodels>=0.14",
    "psutil>=5.9",
    "threadpoolctl>=3.5",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
